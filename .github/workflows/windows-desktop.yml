name: Windows desktop validation
on:
  workflow_dispatch:
    inputs:
      endurance:
        description: 'Ajouter 30 minutes de lecture sur Windows natif'
        type: boolean
        default: false
  push:
    paths: ['windows/**', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Real Electron MP4 / HLS / DASH and controls
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files\Git\usr\bin"
          $env:TVSAMA_WINDOWS_EXE = (Resolve-Path 'dist/win-unpacked/TvSama.exe').Path
          $env:TVSAMA_EXTRA_CHECKS = '1'
          npm run test:e2e
      - name: Native Windows endurance, 30 minutes
        if: github.event_name == 'workflow_dispatch' && inputs.endurance
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files\Git\usr\bin"
          $env:TVSAMA_WINDOWS_EXE = (Resolve-Path 'dist/win-unpacked/TvSama.exe').Path
          $env:TVSAMA_ENDURANCE_MS = '1800000'
          $env:TVSAMA_EXTRA_CHECKS = '1'
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TvSama-Windows-validation
          path: |
            windows/verification/
            windows/dist/*Windows-x64.exe
